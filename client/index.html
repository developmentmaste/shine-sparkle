<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shine & Sparkle Cleaning</title>
  <meta name="description" content="Professional cleaning service tailored to your home and office. Instant booking and transparent rates on WhatsApp." />
  
  <!-- Open Graph / WhatsApp Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Shine & Sparkle Cleaning" />
  <meta property="og:description" content="Professional cleaning service tailored to your home and office. Instant booking and transparent rates on WhatsApp." />
  <meta property="og:image" content="/logo.png" />
  <meta name="theme-color" content="#032E51" />

  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preload" href="/fonts/instrumentsans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Anti-flicker System / Stored Theme Initializer -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('shine_sparkle_theme') || 'system';
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = saved === 'dark' || (saved === 'system' && prefersDark) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', resolved);
        if (resolved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}
    })();
  </script>

  <!-- Google tag (gtag.js) with GDPR Consent Mode -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // Check existing stored consent from Cookie Banner
    var hasAnalyticsConsent = false;
    try {
      var saved = localStorage.getItem('shine_sparkle_cookie_consent');
      if (saved && JSON.parse(saved).analytics) {
        hasAnalyticsConsent = true;
      }
    } catch(e) {}

    gtag('consent', 'default', {
      'analytics_storage': hasAnalyticsConsent ? 'granted' : 'denied',
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied'
    });

    gtag('js', new Date());
    gtag('config', 'G-XFY2CL6WYF', {
      'anonymize_ip': true
    });
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XFY2CL6WYF"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
